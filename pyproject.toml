[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "online-wearing-kgi"
version = "0.1.1"
description = "Raw images to KGI virtual try-on, with a Kaggle evaluation workflow"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "Pillow>=11.1,<14", "torch>=2.7,<3",
  "torchvision>=0.22,<1", "opencv-python>=4.11,<5", "scipy>=1.13,<2",
  "garmentiq==0.0.4.11", "controlnet-aux==0.0.10",
  "onnxruntime>=1.20,<2", "huggingface-hub>=0.34,<2",
  "datasets>=3.6,<5", "scikit-image>=0.25,<1", "tqdm>=4.67,<5",
]

[project.scripts]
online-wearing = "online_wearing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
